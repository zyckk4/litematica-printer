name: Native 1.21.11 build

on:
  push:
    branches: ['1.21.11']
  pull_request:
    branches: ['1.21.11']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/1.21.11' }}
      - name: Build and run native regressions
        shell: bash
        run: ./gradlew clean check build --no-daemon --console=plain
      - name: Check production Mixin loading
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./v1_21_11/tools/production-mixin-smoke.ps1
          -LitematicaJar ./v1_21_11/build/native-dependencies/original/litematica-fabric-1.21.11-0.26.16.jar
          -MalilibJar ./v1_21_11/build/native-dependencies/original/malilib-fabric-1.21.11-0.27.20.jar
      - name: Verify and package release assets
        run: python scripts/prepare_release.py
      - name: Archive verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: printer-mc1.21.11-${{ runner.os }}
          path: dist/*/*
          if-no-files-found: error
          retention-days: 30

# Publication remains a separate reviewed step using a successful build's assets.
