name: Native 1.21.11 build

on:
  push:
    branches: ['1.21.11']
  pull_request:
    branches: ['1.21.11']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run native regressions
        shell: bash
        run: ./gradlew clean check build --no-daemon --console=plain
      - name: Archive printer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: printer-mc1.21.11-${{ runner.os }}
          path: v1_21_11/build/libs/*.jar
          if-no-files-found: error

# Build verification only. Releases are prepared and reviewed manually.
